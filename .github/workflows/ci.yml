name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: API, web, browser and Compose smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medical_lab
          POSTGRES_USER: medical_lab
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U medical_lab -d medical_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mqtt:
        image: eclipse-mosquitto:2
        entrypoint: /usr/sbin/mosquitto
        command: -c /mosquitto-no-auth.conf
        ports: [1883:1883]
        options: >-
          --health-cmd "mosquitto_pub -h 127.0.0.1 -p 1883 -t ci-health -m ready"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-deployment
      DJANGO_TEST_FAST_HASHERS: "1"
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: medical_lab
      DB_USER: medical_lab
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
      MQTT_HOST: localhost
      MQTT_PORT: "1883"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python requirements
        run: python -m pip install --upgrade pip && python -m pip install -r server/requirements-dev.txt
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build React frontend
        working-directory: web
        run: npm run build
      - name: Validate OpenAPI and FHIR schema documents
        working-directory: web
        run: npm run check:contract
      - name: Check migrations and Django configuration
        working-directory: server
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Apply migrations and seed fictional records
        working-directory: server
        run: python manage.py migrate --noinput && python manage.py seed_demo
      - name: Run pytest API, FHIR, privacy and sensor tests
        working-directory: server
        run: python -m pytest -q
      - name: Run Vitest component and chart tests
        working-directory: web
        run: npm test -- --reporter=dot
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright flows
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright screenshots and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-screenshots-and-report
          path: |
            web/test-results/screenshots/
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Build services and run Docker Compose smoke test
        run: |
          docker compose config
          docker compose up -d --build --wait
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health/
          for attempt in $(seq 1 20); do
            if docker compose logs --no-color mqtt-ingest | grep -q "MQTT subscriber connected and ready"; then break; fi
            sleep 1
          done
          before=$(docker compose exec -T app python -c "import django; django.setup(); from core.models import FHIRResource; print(FHIRResource.objects.filter(resource_type='Observation').count())")
          docker compose run --rm app python /app/scripts/simulate_sensors.py --host mqtt --count 3 --interval 0.2
          for attempt in $(seq 1 20); do
            after=$(docker compose exec -T app python -c "import django; django.setup(); from core.models import FHIRResource; print(FHIRResource.objects.filter(resource_type='Observation').count())")
            if [ "$after" -gt "$before" ]; then break; fi
            sleep 1
          done
          test "$after" -gt "$before"
          docker compose ps
          docker compose down --volumes --remove-orphans
